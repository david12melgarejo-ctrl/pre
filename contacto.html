<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | DCU</title>
</head>

<body>
    <header>
        <h1>Formulario de Contacto</h1>
        <p>Ejemplo de formulario accesible y usable</p>
    </header>
    <main>
        <section>
            <h2>Escríbenos</h2>
            <form action="#" method="post">
                <!-- form agrupa los campos del formulario. -->
                <!-- action indica a dónde se envían los datos. method="post" envía los datos de
forma segura. -->
                <!-- Campo: Nombre -->
                <p>
                    <label for="nombre">Nombre completo:</label>
                    <!-- label asocia un texto con un campo. for="nombre" debe coincidir con el id
del input. -->
                    <!-- Esto es CLAVE para accesibilidad: el lector de pantalla lee el label. -->
                    <input type="text" id="nombre" name="nombre" required>
                    <!-- required indica que el campo es obligatorio. -->
                </p>
                <!-- Campo: Correo -->
                <p>
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
                    <!-- type="email" valida que el texto tenga formato de correo. -->
                </p>
                <!-- Campo: Asunto -->
                <p>
                    <label for="asunto">Asunto:</label>
                    <select id="asunto" name="asunto">
                        <!-- select crea una lista desplegable. -->
                        <option value="consulta">Consulta general</option>
                        <option value="sugerencia">Sugerencia</option>
                        <option value="reclamo">Reclamo</option>
                    </select>
                </p>
                <!-- Campo: Mensaje -->
                <p>
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" cols="40"></textarea>
                    <!-- textarea permite escribir texto largo. -->
                </p>
                <!-- Botón de envío -->
                <p>
                    <button type="submit">Enviar mensaje</button>
                    <!-- button type="submit" envía el formulario. -->
                </p>
            </form>
        </section>
        <section>
            <h2>Información de contacto</h2>
            <address>
                <!-- address se usa para información de contacto. -->
                <p>Correo: <a href="mailto:contacto@dcu.edu">contacto@dcu.edu</a></p>
                <p>Teléfono: +51 999 999 999</p>
            </address>
        </section>
    </main>
    <footer>
        <p>Práctica de laboratorio — Formulario accesible</p>
    </footer>
    </body>
</html>
